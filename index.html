<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔥 상동호수공원 인직게임 (In-Jik Match 10)</title>
  <!-- Google Web Fonts: Jua & Pretendard vibe -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&family=Nunito:wght@800;900&display=swap"
    rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #FFF5F7;
      --card-bg: #FFFFFF;
      --primary: #FF5E7E;
      --primary-hover: #FF3B62;
      --secondary: #A0E7E5;
      --accent: #FFAEBC;
      --text: #2E282A;
      --border: #2E282A;
      --apple-bg: #FF6B8B;
      --apple-leaf: #55B369;
      --gold: #FFD166;
      --purple: #BDB2FF;
      --font-fun: 'Jua', 'Gaegu', cursive, sans-serif;
      --font-num: 'Nunito', 'Jua', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      background-image:
        radial-gradient(#FFAEBC 1.5px, transparent 1.5px),
        radial-gradient(#FFAEBC 1.5px, var(--bg-color) 1.5px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      font-family: var(--font-fun);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 8px 30px;
      overflow-x: hidden;
    }

    /* Container */
    .game-wrapper {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Neo-Brutalism MZ Style header */
    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
      border: 3.5px solid var(--border);
      border-radius: 20px;
      padding: 12px 20px;
      box-shadow: 5px 5px 0px var(--border);
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-area h1 {
      font-size: 26px;
      color: var(--primary);
      text-shadow: 1px 1px 0 #FFDEE5;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-mz {
      background: var(--purple);
      border: 2px solid var(--border);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      box-shadow: 2px 2px 0px var(--border);
      color: #fff;
    }

    .action-btn-group {
      display: flex;
      gap: 8px;
    }

    /* Neo-Brutalism Buttons */
    .btn-mz {
      font-family: var(--font-fun);
      font-size: 15px;
      font-weight: bold;
      color: var(--text);
      background: #fff;
      border: 3px solid var(--border);
      border-radius: 14px;
      padding: 8px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 3px 3px 0px var(--border);
      transition: all 0.12s ease;
      outline: none;
    }

    .btn-mz:hover {
      transform: translate(-1.5px, -1.5px);
      box-shadow: 4.5px 4.5px 0px var(--border);
    }

    .btn-mz:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-secondary {
      background: var(--secondary);
    }

    .btn-gold {
      background: var(--gold);
    }

    /* Status Bar (Score, Time, Current Sum) */
    .status-panel {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .status-card {
      background: #FFFFFF;
      border: 3px solid var(--border);
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 4px 4px 0px var(--border);
      position: relative;
    }

    .status-card .label {
      font-size: 13px;
      color: #7A7276;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-card .value {
      font-family: var(--font-num);
      font-size: 26px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.1;
    }

    .status-card.score .value {
      color: var(--primary);
    }

    .status-card.timer .value {
      color: #FF5964;
    }

    .status-card.timer.urgent {
      animation: pulseAlert 0.8s infinite alternate;
      background: #FFE8E8;
    }

    .status-card.sum .value {
      color: #35A7FF;
      transition: transform 0.1s;
    }

    .status-card.sum.perfect {
      background: #D4F4DD;
    }

    .status-card.sum.perfect .value {
      color: #128238;
      transform: scale(1.18);
    }

    @keyframes pulseAlert {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(1.03);
      }
    }

    /* Game Board Section */
    .board-container {
      position: relative;
      background: #FFFDF9;
      border: 4px solid var(--border);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 7px 7px 0px var(--border);
      width: 100%;
      overflow: hidden;
      touch-action: none;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(17, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 6px;
      width: 100%;
      aspect-ratio: 17 / 10;
      position: relative;
      touch-action: none;
    }

    /* Apple Item Styling */
    .apple-item {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      touch-action: none;
    }

    /* Character Image Container */
    .apple-body {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .char-img {
      width: 95%;
      height: 95%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, 0.25));
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .apple-num {
      position: absolute;
      font-family: var(--font-num);
      font-size: clamp(12px, 1.8vw, 18px);
      font-weight: 900;
      color: #FFFFFF;
      background: #FF4A6E;
      border: 2px solid #2E282A;
      border-radius: 50%;
      width: clamp(19px, 2.4vw, 26px);
      height: clamp(19px, 2.4vw, 26px);
      display: flex;
      align-items: center;
      justify-content: center;
      bottom: 0px;
      right: 0px;
      box-shadow: 1.5px 1.5px 0px #2E282A;
      z-index: 5;
      pointer-events: none;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
    }

    /* Selected State */
    .apple-item.selected .apple-body {
      transform: scale(1.15);
    }

    .apple-item.selected .char-img {
      filter: drop-shadow(0 0 6px #FFD166) drop-shadow(0 0 1px #2E282A) brightness(1.12);
    }

    .apple-item.selected .apple-num {
      background: #FFD166;
      color: #2E282A;
      border-color: #2E282A;
      text-shadow: none;
      box-shadow: 2px 2px 0px #2E282A;
      transform: scale(1.15);
    }

    /* Cleared / Vanished */
    .apple-item.cleared {
      visibility: hidden;
      pointer-events: none;
    }

    /* Pop-out vanishing animation */
    .pop-anim {
      animation: popEffect 0.35s ease-out forwards;
    }

    @keyframes popEffect {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.35) rotate(10deg);
        opacity: 0.8;
      }

      100% {
        transform: scale(0.1) rotate(-20deg);
        opacity: 0;
      }
    }

    /* Drag Selection Box Overlay */
    #selection-box {
      position: absolute;
      border: 3px dashed var(--primary);
      background-color: rgba(255, 94, 126, 0.22);
      border-radius: 12px;
      pointer-events: none;
      display: none;
      z-index: 100;
      box-shadow: 0 0 15px rgba(255, 94, 126, 0.3);
      backdrop-filter: blur(1px);
    }

    /* Pause & Game Over Screen Overlays */
    .board-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 245, 247, 0.92);
      backdrop-filter: blur(5px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 150;
      border-radius: 20px;
      gap: 16px;
      animation: fadeIn 0.2s ease-out;
    }

    .board-overlay.show {
      display: flex;
    }

    .overlay-title {
      font-size: 32px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .overlay-subtitle {
      font-size: 18px;
      color: #666;
    }

    /* Floating Score Popup */
    .float-score {
      position: absolute;
      font-family: var(--font-num);
      font-size: 26px;
      font-weight: 900;
      color: #FF2E55;
      text-shadow: 2px 2px 0 #FFF;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 200;
    }

    @keyframes floatUp {
      0% {
        transform: translate(-50%, 0) scale(0.6);
        opacity: 0;
      }

      20% {
        opacity: 1;
        transform: translate(-50%, -10px) scale(1.2);
      }

      100% {
        transform: translate(-50%, -45px) scale(1);
        opacity: 0;
      }
    }

    /* Modal (Ranking & Game Result) */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(46, 40, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-content {
      background: #FFFFFF;
      border: 4px solid var(--border);
      border-radius: 26px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 8px 8px 0px var(--border);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 24px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-close {
      background: #FFECEF;
      border: 2px solid var(--border);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ranking List Table */
    .ranking-list {
      max-height: 280px;
      overflow-y: auto;
      border: 2px solid var(--border);
      border-radius: 16px;
      background: #FFF9FA;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
    }

    .ranking-item.rank-1 {
      background: #FFF2C6;
      border-color: #E2A400;
    }

    .ranking-item.rank-2 {
      background: #ECEFF1;
    }

    .ranking-item.rank-3 {
      background: #FFE2D4;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 900;
      margin-right: 8px;
    }

    .rank-name {
      flex: 1;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-score {
      font-family: var(--font-num);
      font-size: 16px;
      font-weight: 900;
      color: var(--primary);
    }

    .rank-date {
      font-size: 11px;
      color: #999;
      margin-left: 8px;
    }

    /* Game Over Input Box */
    .save-score-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #F0F8FF;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      margin-top: 4px;
    }

    .save-input-row {
      display: flex;
      gap: 8px;
    }

    .input-mz {
      flex: 1;
      font-family: var(--font-fun);
      font-size: 16px;
      padding: 8px 12px;
      border: 2.5px solid var(--border);
      border-radius: 12px;
      outline: none;
      box-shadow: 2px 2px 0 var(--border);
    }

    .input-mz:focus {
      border-color: var(--primary);
    }

    /* Help & Tip Section */
    .help-bar {
      font-size: 13px;
      color: #6A6065;
      text-align: center;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #FFF;
      border: 2px dashed #D2C4C9;
      border-radius: 999px;
      padding: 6px 16px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes popIn {
      from {
        transform: scale(0.85);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Responsive adjustments */
    @media (max-width: 680px) {
      .header-bar {
        padding: 8px 12px;
      }

      .title-area h1 {
        font-size: 20px;
      }

      .status-panel {
        gap: 6px;
      }

      .status-card {
        padding: 6px 4px;
      }

      .status-card .label {
        font-size: 11px;
      }

      .status-card .value {
        font-size: 20px;
      }

      .board-container {
        padding: 8px;
        border-radius: 16px;
      }

      .board-grid {
        gap: 3px;
      }

      .apple-body {
        border-width: 1.5px;
      }

      .btn-mz {
        font-size: 13px;
        padding: 6px 10px;
      }
    }
  </style>
</head>

<body>

  <div class="game-wrapper">
    <!-- Top Header -->
    <header class="header-bar">
      <div class="title-area">
        <h1>🔥 상동호수공원 인직게임</h1>
        <span class="badge-mz">상동호수공원 VER 10.0</span>
      </div>
      <div class="action-btn-group">
        <button class="btn-mz btn-secondary" id="soundBtn" title="효과음 On/Off">
          <span id="soundIcon">🔊</span>
        </button>
        <button class="btn-mz btn-gold" id="rankingBtn">
          🏆 랭킹
        </button>
        <button class="btn-mz btn-primary" id="restartBtn">
          🔄 다시시작
        </button>
      </div>
    </header>

    <!-- Status Cards (Score, Timer, Current Selection Sum, Left Apples) -->
    <section class="status-panel">
      <div class="status-card score">
        <div class="label">⭐ 내 점수</div>
        <div class="value" id="scoreDisplay">0</div>
      </div>
      <div class="status-card timer" id="timerCard">
        <div class="label">⏳ 남은 시간</div>
        <div class="value" id="timerDisplay">120</div>
      </div>
      <div class="status-card sum" id="sumCard">
        <div class="label">🎯 현재 선택 합</div>
        <div class="value" id="sumDisplay">0</div>
      </div>
      <div class="status-card">
        <div class="label">🔥 남은 인직</div>
        <div class="value" id="remainDisplay">170</div>
      </div>
    </section>

    <!-- Pause Bar / Play Control -->
    <div style="width: 100%; display: flex; justify-content: flex-end;">
      <button class="btn-mz" id="pauseBtn" style="padding: 5px 14px; font-size: 14px;">
        ⏸️ 일시 정지 (Space)
      </button>
    </div>

    <!-- Board Container -->
    <div class="board-container" id="boardContainer">
      <!-- Grid -->
      <div class="board-grid" id="boardGrid">
        <!-- 17x10 = 170 apples injected dynamically -->
      </div>

      <!-- Drag Selection Box -->
      <div id="selection-box"></div>

      <!-- Pause Overlay -->
      <div class="board-overlay" id="pauseOverlay">
        <div class="overlay-title">⏸️ 잠시 쉬어가는 중!</div>
        <div class="overlay-subtitle">머리 식히고 숨 고르기 ✨</div>
        <button class="btn-mz btn-primary" id="resumeBtn" style="font-size: 18px; padding: 10px 24px;">
          ▶️ 계속하기
        </button>
      </div>

      <!-- Game Over Overlay -->
      <div class="board-overlay" id="gameOverOverlay">
        <div class="overlay-title" id="gameOverTitle">⏰ 타임 오버!</div>
        <div class="overlay-subtitle" id="gameOverDesc">최종 점수: <b id="finalScoreVal"
            style="color:var(--primary); font-size: 26px;">0</b>점</div>
        <button class="btn-mz btn-primary" id="modalResultBtn" style="margin-top: 10px; font-size: 16px;">
          📝 기록 등록 & 랭킹 보기
        </button>
      </div>
    </div>

    <!-- Tip Bar -->
    <div class="help-bar">
      <span>💡 <b>플레이 팁:</b> 드래그로 사각형을 만들어 <b>숫자의 합이 정확히 10</b>이 되면 인직이가 팡팡 터져요!</span>
    </div>
  </div>

  <!-- Modal: Ranking & Record Save -->
  <div class="modal-backdrop" id="rankingModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🏆 명예의 전당 (Top 10)</h2>
        <button class="btn-close" id="closeRankingBtn">✕</button>
      </div>

      <!-- Record Save Box (Shown when finishing game) -->
      <div class="save-score-box" id="saveScoreBox" style="display: none;">
        <div style="font-size: 14px; font-weight: bold; color: var(--text);">
          🎉 방금 획득한 <span id="newRecordScore" style="color:var(--primary); font-size: 18px;">0</span>점을 랭킹에 등록하세요!
        </div>
        <div class="save-input-row">
          <input type="text" id="nicknameInput" class="input-mz" maxlength="10" placeholder="닉네임 입력 (최대 10자)">
          <button class="btn-mz btn-primary" id="saveScoreBtn">저장 🚀</button>
        </div>
      </div>

      <!-- Top 10 List -->
      <div class="ranking-list" id="rankingList">
        <!-- Injected dynamically -->
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
        <button class="btn-mz" id="resetRankingBtn" style="font-size: 12px; padding: 5px 10px; color: #888;">
          기록 초기화
        </button>
        <button class="btn-mz btn-secondary" id="modalConfirmBtn">
          닫기
        </button>
      </div>
    </div>
  </div>

  <script>
    /**
     * 🔥 상동호수공원 인직게임 (Injik Game at Sangdong Lake Park)
     * Single File Web Application
     */

    // 1. Audio Synthesizer (Web Audio API)
    class SoundFX {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }

      playPop(count = 2) {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;

        // Bubble Pop multi-burst chord
        const baseFreq = 520 + Math.min(count * 60, 400);
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.8, now + 0.12);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.12);
      }

      playDrag() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(280, now);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }

      playOver() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const freqs = [440, 392, 349, 293];
        freqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, now + idx * 0.12);
          gain.gain.setValueAtTime(0.15, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.25);
        });
      }

      playFanfare() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
        notes.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + idx * 0.09);
          gain.gain.setValueAtTime(0.2, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.09 + 0.3);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.35);
        });
      }
    }

    // 2. Main Game Controller
    class AppleGame {
      constructor() {
        this.COLS = 17;
        this.ROWS = 10;
        this.TOTAL_APPLES = this.COLS * this.ROWS;
        this.GAME_TIME = 120; // 120 seconds countdown

        this.grid = []; // 2D array of { r, c, val, cleared, el }
        this.score = 0;
        this.timeLeft = this.GAME_TIME;
        this.timerId = null;
        this.isPaused = false;
        this.isGameOver = false;

        // Drag selection state
        this.isDragging = false;
        this.dragStart = null; // { x, y } in client coord
        this.currentSelection = []; // array of apple items currently in rectangle

        this.sound = new SoundFX();
        this.initElements();
        this.bindEvents();
        this.renderRankings();
        this.startNewGame();
      }

      initElements() {
        this.boardContainer = document.getElementById('boardContainer');
        this.boardGrid = document.getElementById('boardGrid');
        this.selectionBox = document.getElementById('selection-box');
        this.scoreDisplay = document.getElementById('scoreDisplay');
        this.timerDisplay = document.getElementById('timerDisplay');
        this.timerCard = document.getElementById('timerCard');
        this.sumDisplay = document.getElementById('sumDisplay');
        this.sumCard = document.getElementById('sumCard');
        this.remainDisplay = document.getElementById('remainDisplay');

        this.pauseBtn = document.getElementById('pauseBtn');
        this.resumeBtn = document.getElementById('resumeBtn');
        this.pauseOverlay = document.getElementById('pauseOverlay');
        this.gameOverOverlay = document.getElementById('gameOverOverlay');
        this.finalScoreVal = document.getElementById('finalScoreVal');

        this.restartBtn = document.getElementById('restartBtn');
        this.rankingBtn = document.getElementById('rankingBtn');
        this.soundBtn = document.getElementById('soundBtn');
        this.soundIcon = document.getElementById('soundIcon');

        // Modals
        this.rankingModal = document.getElementById('rankingModal');
        this.closeRankingBtn = document.getElementById('closeRankingBtn');
        this.modalConfirmBtn = document.getElementById('modalConfirmBtn');
        this.modalResultBtn = document.getElementById('modalResultBtn');
        this.rankingList = document.getElementById('rankingList');
        this.saveScoreBox = document.getElementById('saveScoreBox');
        this.nicknameInput = document.getElementById('nicknameInput');
        this.saveScoreBtn = document.getElementById('saveScoreBtn');
        this.newRecordScore = document.getElementById('newRecordScore');
        this.resetRankingBtn = document.getElementById('resetRankingBtn');
      }

      bindEvents() {
        // Buttons
        this.restartBtn.addEventListener('click', () => this.startNewGame());
        this.pauseBtn.addEventListener('click', () => this.togglePause());
        this.resumeBtn.addEventListener('click', () => this.togglePause());
        this.rankingBtn.addEventListener('click', () => this.openRankingModal(false));
        this.closeRankingBtn.addEventListener('click', () => this.closeRankingModal());
        this.modalConfirmBtn.addEventListener('click', () => this.closeRankingModal());
        this.modalResultBtn.addEventListener('click', () => this.openRankingModal(true));
        this.saveScoreBtn.addEventListener('click', () => this.saveScore());
        this.resetRankingBtn.addEventListener('click', () => this.resetRanking());

        // Sound toggle
        this.soundBtn.addEventListener('click', () => {
          const on = this.sound.toggle();
          this.soundIcon.textContent = on ? '🔊' : '🔇';
        });

        // Keyboard shortcut (Space to pause)
        window.addEventListener('keydown', (e) => {
          if (e.code === 'Space' && !this.isGameOver) {
            if (e.target.tagName !== 'INPUT') {
              e.preventDefault();
              this.togglePause();
            }
          }
        });

        // Pointer events on the board container for mouse and touch dragging
        this.boardContainer.addEventListener('pointerdown', (e) => this.onPointerDown(e));
        window.addEventListener('pointermove', (e) => this.onPointerMove(e));
        window.addEventListener('pointerup', (e) => this.onPointerUp(e));
        window.addEventListener('pointercancel', (e) => this.onPointerUp(e));

        // Nickname Enter key
        this.nicknameInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            this.saveScore();
          }
        });
      }

      startNewGame() {
        clearInterval(this.timerId);
        this.isPaused = false;
        this.isGameOver = false;
        this.score = 0;
        this.timeLeft = this.GAME_TIME;
        this.currentSelection = [];

        this.scoreDisplay.textContent = '0';
        this.timerDisplay.textContent = this.GAME_TIME;
        this.timerCard.classList.remove('urgent');
        this.sumDisplay.textContent = '0';
        this.remainDisplay.textContent = this.TOTAL_APPLES;

        this.pauseOverlay.classList.remove('show');
        this.gameOverOverlay.classList.remove('show');
        this.pauseBtn.innerHTML = '⏸️ 일시 정지 (Space)';

        this.createBoard();
        this.startTimer();
      }

      startTimer() {
        clearInterval(this.timerId);
        this.timerId = setInterval(() => {
          if (this.isPaused || this.isGameOver) return;
          this.timeLeft--;
          this.timerDisplay.textContent = this.timeLeft;

          if (this.timeLeft <= 20) {
            this.timerCard.classList.add('urgent');
          }

          if (this.timeLeft <= 0) {
            this.endGame('⏰ 타임 오버!');
          }
        }, 1000);
      }

      togglePause() {
        if (this.isGameOver) return;
        this.isPaused = !this.isPaused;

        if (this.isPaused) {
          this.pauseOverlay.classList.add('show');
          this.pauseBtn.innerHTML = '▶️ 계속하기 (Space)';
          this.clearSelection();
        } else {
          this.pauseOverlay.classList.remove('show');
          this.pauseBtn.innerHTML = '⏸️ 일시 정지 (Space)';
        }
      }

      // Pointer drag selection logic
      onPointerDown(e) {
        if (this.isPaused || this.isGameOver) return;
        // Only handle primary button (left click / touch)
        if (e.button !== undefined && e.button !== 0) return;

        this.isDragging = true;
        const rect = this.boardContainer.getBoundingClientRect();
        this.dragStart = {
          x: e.clientX,
          y: e.clientY
        };

        this.updateSelectionBox(e.clientX, e.clientY);
        this.selectionBox.style.display = 'block';
        this.updateSelectedApples(e.clientX, e.clientY);
      }

      onPointerMove(e) {
        if (!this.isDragging || !this.dragStart) return;
        this.updateSelectionBox(e.clientX, e.clientY);
        this.updateSelectedApples(e.clientX, e.clientY);
      }

      onPointerUp(e) {
        if (!this.isDragging) return;
        this.isDragging = false;
        this.selectionBox.style.display = 'none';

        this.evaluateSelection();
      }

      updateSelectionBox(currX, currY) {
        const containerRect = this.boardContainer.getBoundingClientRect();

        const minX = Math.min(this.dragStart.x, currX) - containerRect.left;
        const maxX = Math.max(this.dragStart.x, currX) - containerRect.left;
        const minY = Math.min(this.dragStart.y, currY) - containerRect.top;
        const maxY = Math.max(this.dragStart.y, currY) - containerRect.top;

        this.selectionBox.style.left = `${minX}px`;
        this.selectionBox.style.top = `${minY}px`;
        this.selectionBox.style.width = `${maxX - minX}px`;
        this.selectionBox.style.height = `${maxY - minY}px`;
      }

      updateSelectedApples(currX, currY) {
        const selBoxRect = {
          left: Math.min(this.dragStart.x, currX),
          right: Math.max(this.dragStart.x, currX),
          top: Math.min(this.dragStart.y, currY),
          bottom: Math.max(this.dragStart.y, currY)
        };

        let sum = 0;
        const newlySelected = [];

        // Find grid bounding box intersection
        for (let r = 0; r < this.ROWS; r++) {
          for (let c = 0; c < this.COLS; c++) {
            const item = this.grid[r][c];
            if (item.cleared) continue;

            const elRect = item.el.getBoundingClientRect();
            // Check if item overlaps with selection rectangle
            const isOverlap = !(
              elRect.right < selBoxRect.left ||
              elRect.left > selBoxRect.right ||
              elRect.bottom < selBoxRect.top ||
              elRect.top > selBoxRect.bottom
            );

            if (isOverlap) {
              newlySelected.push(item);
              sum += item.val;
              item.el.classList.add('selected');
            } else {
              item.el.classList.remove('selected');
            }
          }
        }

        if (newlySelected.length !== this.currentSelection.length) {
          this.sound.playDrag();
        }

        this.currentSelection = newlySelected;
        this.sumDisplay.textContent = sum;

        if (sum === 10) {
          this.sumCard.classList.add('perfect');
        } else {
          this.sumCard.classList.remove('perfect');
        }
      }

      evaluateSelection() {
        const sum = this.currentSelection.reduce((acc, cur) => acc + cur.val, 0);

        if (sum === 10 && this.currentSelection.length > 0) {
          // Success! Clear apples
          const clearedCount = this.currentSelection.length;
          this.score += clearedCount;
          this.scoreDisplay.textContent = this.score;

          this.sound.playPop(clearedCount);

          // Show floating popup score at center of selection
          this.showFloatScore(`+${clearedCount}`);

          // Animate cleared apples
          this.currentSelection.forEach((item) => {
            item.cleared = true;
            item.el.classList.remove('selected');
            item.el.classList.add('pop-anim');
            setTimeout(() => {
              item.el.classList.add('cleared');
              item.el.classList.remove('pop-anim');
            }, 320);
          });

          // Update remaining count
          const remaining = this.grid.flat().filter(it => !it.cleared).length - clearedCount;
          this.remainDisplay.textContent = Math.max(0, remaining);

          // Check if board fully cleared!
          if (remaining <= 0) {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            this.sound.playFanfare();
            this.endGame('🎉 올 클리어! 대단해요!');
          }
        } else {
          // Clear selection styling
          this.clearSelection();
        }

        this.currentSelection = [];
        this.sumDisplay.textContent = '0';
        this.sumCard.classList.remove('perfect');
      }

      clearSelection() {
        for (let r = 0; r < this.ROWS; r++) {
          for (let c = 0; c < this.COLS; c++) {
            this.grid[r][c].el.classList.remove('selected');
          }
        }
        this.sumDisplay.textContent = '0';
        this.sumCard.classList.remove('perfect');
      }

      showFloatScore(text) {
        if (this.currentSelection.length === 0) return;
        const firstRect = this.currentSelection[0].el.getBoundingClientRect();
        const containerRect = this.boardContainer.getBoundingClientRect();

        const popup = document.createElement('div');
        popup.className = 'float-score';
        popup.textContent = text;
        popup.style.left = `${firstRect.left - containerRect.left + firstRect.width / 2}px`;
        popup.style.top = `${firstRect.top - containerRect.top}px`;

        this.boardContainer.appendChild(popup);
        setTimeout(() => popup.remove(), 800);
      }

      endGame(titleMsg = '⏰ 타임 오버!') {
        this.isGameOver = true;
        clearInterval(this.timerId);
        this.sound.playOver();

        this.finalScoreVal.textContent = this.score;
        const titleEl = document.getElementById('gameOverTitle');
        if (titleEl) titleEl.textContent = titleMsg;
        this.gameOverOverlay.classList.add('show');
      }

      // 3. Ranking System (LocalStorage)
      getRankings() {
        try {
          const data = localStorage.getItem('apple_game_rankings');
          return data ? JSON.parse(data) : [];
        } catch (e) {
          return [];
        }
      }

      saveRankingList(list) {
        try {
          localStorage.setItem('apple_game_rankings', JSON.stringify(list));
        } catch (e) {
          console.error(e);
        }
      }

      renderRankings() {
        const list = this.getRankings();
        this.rankingList.innerHTML = '';

        if (list.length === 0) {
          this.rankingList.innerHTML = `
        <div style="text-align:center; padding: 20px; color:#888; font-size:14px;">
          아직 등록된 랭킹 기록이 없습니다.<br>첫 번째 랭커가 되어보세요! 🔥
        </div>
      `;
          return;
        }

        list.slice(0, 10).forEach((item, index) => {
          const row = document.createElement('div');
          row.className = `ranking-item rank-${index + 1}`;

          let medal = `${index + 1}`;
          if (index === 0) medal = '🥇 1';
          else if (index === 1) medal = '🥈 2';
          else if (index === 2) medal = '🥉 3';

          row.innerHTML = `
        <span class="rank-badge">${medal}</span>
        <span class="rank-name">${this.escapeHtml(item.nickname)}</span>
        <span class="rank-score">${item.score}점</span>
        <span class="rank-date">${item.date}</span>
      `;
          this.rankingList.appendChild(row);
        });
      }

      openRankingModal(isFromGameOver = false) {
        this.renderRankings();
        this.rankingModal.classList.add('show');

        if (isFromGameOver && this.score > 0) {
          this.saveScoreBox.style.display = 'flex';
          this.newRecordScore.textContent = this.score;
          this.nicknameInput.value = '';
          this.nicknameInput.focus();
        } else {
          this.saveScoreBox.style.display = 'none';
        }
      }

      closeRankingModal() {
        this.rankingModal.classList.remove('show');
      }

      saveScore() {
        let name = this.nicknameInput.value.trim();
        if (!name) name = '상동호수인직';

        const dateStr = new Date().toLocaleDateString('ko-KR', {
          month: 'numeric',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        const list = this.getRankings();
        list.push({
          nickname: name,
          score: this.score,
          date: dateStr
        });

        // Sort by highest score first
        list.sort((a, b) => b.score - a.score);
        this.saveRankingList(list.slice(0, 10));

        this.saveScoreBox.style.display = 'none';
        this.renderRankings();

        confetti({ particleCount: 70, spread: 60 });
      }

      resetRanking() {
        if (confirm('정말로 모든 랭킹 기록을 초기화하시겠습니까?')) {
          localStorage.removeItem('apple_game_rankings');
          this.renderRankings();
        }
      }

      escapeHtml(str) {
        return str.replace(/[&<>'"]/g,
          tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
      }
    }

    // Start game instance when DOM is ready
    window.addEventListener('DOMContentLoaded', () => {
      window.appleGame = new AppleGame();
    });
  </script>
</body>

</html>
